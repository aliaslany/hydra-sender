name: Deploy Hydra Real Estate Worker & GitHub Pages

on:
  push:
    branches: ["main", "HydraSender"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    name: Test & Deploy Cloudflare Worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Apply Cloudflare D1 Schema & Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set in GitHub Secrets; skipping remote Cloudflare deployment."
            exit 0
          fi
          npx wrangler d1 execute hydra-db --remote --yes --file=migrations/0001_init.sql
          npx wrangler deploy

  deploy-pages:
    runs-on: ubuntu-latest
    name: Publish Website to GitHub Pages
    steps:
      - uses: actions/checkout@v4
      - name: Stage static website files
        run: |
          mkdir -p _site
          cp index.html seo.html 404.html robots.txt sitemap.xml CNAME .nojekyll _site/
          cp -r assets _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - uses: actions/deploy-pages@v4
